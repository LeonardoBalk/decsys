name: Link check

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: Códigos do catálogo separados por vírgula (vazio confere todos)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  catalog-links:
    name: Fontes por link do catálogo de coleta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/requirements.txt
      - run: pip install -r services/ingestion/requirements.txt
      - run: python -m services.ingestion.tests.live_catalog_check --only "$ONLY"
        env:
          ONLY: ${{ inputs.only }}
