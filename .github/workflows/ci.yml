name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Interface (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ingestion:
    name: Serviço de tratamento (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion/requirements.txt
      - run: pip install -r services/ingestion/requirements.txt
      - run: |
          python -m unittest \
            services.ingestion.tests.test_approval_options \
            services.ingestion.tests.test_batch_municipal_approval \
            services.ingestion.tests.test_benchmark_suggestion \
            services.ingestion.tests.test_benchmarks_by_profile \
            services.ingestion.tests.test_collection_sources \
            services.ingestion.tests.test_dashboard_values_filters \
            services.ingestion.tests.test_iiu_configuration \
            services.ingestion.tests.test_iiu_panels \
            services.ingestion.tests.test_iiu_thesis_model \
            services.ingestion.tests.test_import_fixture_matrix \
            services.ingestion.tests.test_import_flow \
            services.ingestion.tests.test_import_lifecycle \
            services.ingestion.tests.test_import_lifecycle_sql \
            services.ingestion.tests.test_import_reading \
            services.ingestion.tests.test_indicator_coverage \
            services.ingestion.tests.test_link_discovery \
            services.ingestion.tests.test_municipal_series \
            services.ingestion.tests.test_municipality_matching \
            services.ingestion.tests.test_period_preparation
